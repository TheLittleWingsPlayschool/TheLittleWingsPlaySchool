<!--
  ============================================================================
  THE LITTLE WINGS PLAY SCHOOL — WEBSITE ENQUIRY FORM (ready to paste)
  ============================================================================
  What it does
    Parents fill this short form on your website. The enquiry goes straight
    into your dashboard's Enquiries page with source "Website" and a NEW badge
    (and a purple note on the dashboard home page).

  How to add it (about 5 minutes, on a computer)
    1. Open your website repository on GitHub:
       (the repository that publishes thelittlewingsplayschool.github.io)
    2. Click index.html, then the pencil icon (Edit).
    3. Find the place where you want the form, for example just ABOVE your
       "Contact" section. Tip: press Ctrl+F and search for  id="contact"
    4. Copy EVERYTHING from the line that says  LW ENQUIRY FORM START
       down to the line that says  LW ENQUIRY FORM END  (below), and paste
       it there.
    5. Click "Commit changes". After 1–2 minutes, open your website and send a
       test enquiry. It appears in the dashboard under Enquiries → "🌐 New".
       (Delete the test enquiry afterwards.)

  Safety
    - The form can only ADD an enquiry. It cannot read any school data.
    - It has spam protection (hidden trap field, minimum time, and limits per
      device and per mobile number). No passwords or secret keys are in here.
    - It only works from your website address (thelittlewingsplayschool.github.io).
  ============================================================================
-->

<!-- LW ENQUIRY FORM START -->
<section id="admission-enquiry" class="lw-enq" aria-labelledby="lw-enq-title">
  <style>
    .lw-enq { max-width: 560px; margin: 2rem auto; padding: 1.4rem 1.2rem; background: #fff; border-radius: 20px; box-shadow: 0 6px 24px rgba(36,56,77,.10); font-family: inherit; color: #24384d; border-top: 8px solid #38a8e0; }
    .lw-enq h2 { margin: 0 0 .3rem; font-size: 1.5rem; color: #1f86bd; }
    .lw-enq p.lw-sub { margin: 0 0 1rem; color: #5b6b7c; }
    .lw-enq form { display: grid; gap: .8rem; }
    .lw-enq .lw-row { display: grid; gap: .8rem; grid-template-columns: 1fr 1fr; }
    @media (max-width: 520px) { .lw-enq .lw-row { grid-template-columns: 1fr; } }
    .lw-enq label { display: grid; gap: .3rem; font-weight: 600; font-size: .95rem; }
    .lw-enq input, .lw-enq select, .lw-enq textarea { font: inherit; font-weight: 400; padding: .7rem .8rem; border: 2px solid #e3e9ef; border-radius: 12px; width: 100%; box-sizing: border-box; background: #fff; color: inherit; }
    .lw-enq input:focus, .lw-enq select:focus, .lw-enq textarea:focus { outline: none; border-color: #38a8e0; }
    .lw-enq .lw-hp { position: absolute !important; left: -10000px !important; width: 1px; height: 1px; overflow: hidden; }
    .lw-enq button { font: inherit; font-weight: 700; font-size: 1.05rem; padding: .85rem 1rem; border: 0; border-radius: 999px; background: #38a8e0; color: #fff; cursor: pointer; box-shadow: 0 3px 0 #1f86bd; }
    .lw-enq button[disabled] { opacity: .6; cursor: wait; }
    .lw-enq .lw-msg { padding: .8rem 1rem; border-radius: 12px; display: none; }
    .lw-enq .lw-msg.ok { display: block; background: #e8f7ee; color: #1e7a3c; }
    .lw-enq .lw-msg.err { display: block; background: #fff0ee; color: #c2453a; }
    .lw-enq small { color: #6b7a8c; font-weight: 400; }
  </style>
  <h2 id="lw-enq-title">Admission enquiry</h2>
  <p class="lw-sub">Leave your details and we will call you back. Or call / WhatsApp <a href="tel:+917995554105">+91 79955 54105</a>.</p>
  <form id="lw-enq-form" novalidate>
    <div class="lw-row">
      <label>Child's name *<input name="childName" maxlength="80" required autocomplete="off"></label>
      <label>Child's date of birth<input name="dob" type="date"></label>
    </div>
    <div class="lw-row">
      <label>Your name *<input name="parentName" maxlength="80" required autocomplete="name"></label>
      <label>You are the child's
        <select name="relation"><option>Mother</option><option>Father</option><option>Guardian</option></select>
      </label>
    </div>
    <div class="lw-row">
      <label>Mobile number *<input name="phone" type="tel" inputmode="tel" maxlength="16" placeholder="10-digit mobile" required autocomplete="tel"></label>
      <label>Class interested in
        <select name="classId"><option value="">Not sure</option><option value="toddlers">Toddlers (1.5&ndash;3 yrs)</option><option value="nursery">Nursery (3&ndash;4 yrs)</option><option value="lkg">LKG (4&ndash;5 yrs)</option><option value="ukg">UKG (5&ndash;6 yrs)</option></select>
      </label>
    </div>
    <label>Area / address<input name="address" maxlength="200" autocomplete="street-address" placeholder="e.g. Vuyyuru, near bus stand"></label>
    <label>Message <small>(optional)</small><textarea name="message" rows="3" maxlength="600" placeholder="Timings, fees, transport..."></textarea></label>
    <div class="lw-hp" aria-hidden="true"><label>Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
    <button type="submit">Send enquiry</button>
    <div class="lw-msg" role="status" aria-live="polite"></div>
  </form>
  <script>
  (function () {
    var ENDPOINT = 'https://juurtxcmvvkoxegehiod.supabase.co/functions/v1/lw-enquiry';
    var form = document.getElementById('lw-enq-form');
    if (!form) return;
    var started = Date.now();
    var msg = form.querySelector('.lw-msg'), btn = form.querySelector('button[type=submit]');
    function show(text, ok) { msg.textContent = text; msg.className = 'lw-msg ' + (ok ? 'ok' : 'err'); }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      msg.className = 'lw-msg'; msg.textContent = '';
      var f = function (n) { return (form.elements[n] && form.elements[n].value || '').trim(); };
      var phone = f('phone').replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '').replace(/^0(?=\d{10}$)/, '');
      if (f('childName').length < 2) return show("Please enter your child's name.");
      if (f('parentName').length < 2) return show('Please enter your name.');
      if (!/^[6-9]\d{9}$/.test(phone)) return show('Please enter a valid 10-digit mobile number.');
      btn.disabled = true; btn.textContent = 'Sending\u2026';
      fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ childName: f('childName'), dob: f('dob'), parentName: f('parentName'), relation: f('relation'), phone: phone,
          classId: f('classId'), address: f('address'), message: f('message'), website: f('website'), t: Date.now() - started })
      }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (res.ok && res.j.ok) { form.reset(); show('Thank you! \uD83D\uDE4F We received your enquiry and will call you soon.', true); btn.textContent = 'Sent \u2713'; return; }
          show((res.j && res.j.error) || 'Sorry, it did not go through. Please call or WhatsApp +91 79955 54105.');
          btn.disabled = false; btn.textContent = 'Send enquiry';
        })
        .catch(function () { show('No internet? Please try again, or call / WhatsApp +91 79955 54105.'); btn.disabled = false; btn.textContent = 'Send enquiry'; });
    });
  })();
  </script>
</section>
<!-- LW ENQUIRY FORM END -->
